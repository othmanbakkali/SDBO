version: '3.8'

services:
  webschool-app:
    build: .
    container_name: webschool_app
    restart: always
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=production
      - PORT=3008
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3008/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
